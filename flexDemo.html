<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Flex Column Alignment</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: space-between;     /* vertical alignment (main axis) */
      align-items: flex-end;         /* horizontal alignment (cross axis) */
      flex-direction: column;      /* main axis is top to bottom */
      background: #f0f0f0;
      font-family: Arial, sans-serif;
    }

    .box {
      background: #007acc;
      color: white;
      padding: 20px 40px;
      margin: 10px;
      border-radius: 6px;
      font-size: 18px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
    }
  </style>
</head>
<body>

  <div class="box">Box 1</div>
  <div class="box">Box 2</div>
  <div class="box">Box 3</div>

</body>
</html>
